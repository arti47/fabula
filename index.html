<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<meta name="description" content="Build a story with the Fabula Deck for Kids: an idea, the ingredients, nine beats, and the boosts that make it better.">
<title>Story Machine</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#screen">Skip to content</a>

  <!-- One band. It carries where you are, what is still blank, and the way to everywhere else. -->
  <header class="app-header" id="app-header">
    <h1 class="visually-hidden">Story Machine</h1>
    <!-- The bar says where you are as well as how to leave: taking the tab bar away took the app's
         only labelled landmark and its only aria-current with it (D31). -->
    <nav class="app-nav" aria-label="Main">
      <button type="button" id="menu-button" class="icon-button" aria-label="Go somewhere else" aria-haspopup="dialog">
        <span aria-hidden="true" data-menu-icon></span>
      </button>
      <a href="#/stories" class="here" id="here">Stories</a>
    </nav>
    <a href="#/settings" class="icon-button" aria-label="Settings"><span aria-hidden="true" data-settings-icon></span></a>
  </header>

  <!-- The persistent resource header: the counts that say what is still blank. -->
  <div class="story-header" id="story-header" hidden></div>

  <main id="screen" class="screen" tabindex="-1"></main>

  <div id="action-bar-mount"></div>


  <div id="toast-mount" class="toast-mount" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-mount"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
